[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# El tronco: fijamos la version del compilador. Nunca "la que agarre".
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200

# "cancun" es el denominador comun de mainnet y la mayoria de L2s.
# Si tu cadena destino ya soporta prague/osaka, subilo a proposito.
evm_version = "cancun"

# El script de despliegue escribe las direcciones donde el frontend las
# lee. Es el unico permiso de escritura que tiene.
fs_permissions = [{access = "write", path = "./web/public/deployments.json"}]

[fuzz]
runs = 512
max_test_rejects = 100_000

[invariant]
runs = 256
depth = 64
fail_on_revert = true

# forge test --profile ci   -> mismas pruebas, mucho mas fuzzing
[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 1_000
depth = 128
fail_on_revert = true

# forge coverage instrumenta el codigo y deja artefactos distintos.
# Si comparte carpeta con el build normal, el siguiente `forge test`
# se queda sin encontrar las pruebas. Le damos su propia carpeta.
[profile.coverage]
out = "out-coverage"
cache_path = "cache-coverage"
optimizer = false

[fmt]
# 90 columnas: entra un import de OpenZeppelin en una sola linea y el
# codigo sigue leyendose bien en pantalla partida y en video.
line_length = 90
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
# Hoodi es la testnet vigente para esto: tiene soporte hasta 2028.
# Holesky se apago en septiembre de 2025 y Sepolia se retira en
# septiembre de 2026.
# El RPC va literal para que funcione sin configurar nada. Si queres
# usar tu propio nodo, cambialo aca y listo.
hoodi = "https://rpc.hoodi.ethpandaops.io"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
hoodi = {key = "${ETHERSCAN_API_KEY}", chain = 560048}
sepolia = {key = "${ETHERSCAN_API_KEY}"}
